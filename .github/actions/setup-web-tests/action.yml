name: Set up Web test runtime
description: Cached browser tooling and stable native fixture generator; no Gradle or JDK.
inputs:
  browser:
    default: chromium
    description: Installed test browser; Safari uses the macOS system browser.
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: |
          ~/.npm
          ~/.cache/ms-playwright
        key: livephoto-web-${{ runner.os }}-${{ hashFiles('scripts/web/package.json') }}

    - name: Install pinned browser tooling
      shell: bash
      working-directory: scripts/web
      env:
        LIVEPHOTO_TEST_BROWSER: ${{ inputs.browser }}
      run: |
        case "$LIVEPHOTO_TEST_BROWSER" in
          chromium|firefox|safari) ;;
          *) echo "Unsupported test browser" >&2; exit 1 ;;
        esac
        npm install --ignore-scripts --no-audit --no-fund
        if [[ "$LIVEPHOTO_TEST_BROWSER" == safari ]]; then exit 0; fi
        if [[ "$RUNNER_OS" == Linux ]]; then
          # Scope only Playwright's apt calls to the signed runner Ubuntu sources.
          # In particular, an unrelated vendor mirror returning 403 must not block browser tests.
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          test -s "$ubuntu_sources"
          apt_config=$(mktemp)
          trap 'rm -f "$apt_config"' EXIT
          printf 'Dir::Etc::sourcelist "%s";\nDir::Etc::sourceparts "-";\n' "$ubuntu_sources" > "$apt_config"
          sudo env "APT_CONFIG=$apt_config" "$(command -v node)" ./node_modules/playwright/cli.js install-deps "$LIVEPHOTO_TEST_BROWSER"
          npx playwright install "$LIVEPHOTO_TEST_BROWSER"
        else
          npx playwright install --with-deps "$LIVEPHOTO_TEST_BROWSER"
        fi

    - name: Cache stable FFmpeg fixture generator
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/livephoto-web-ffmpeg/n9.0
        key: web-ffmpeg-n9.0-v1-${{ runner.os }}-${{ runner.arch }}

    - name: Validate cached FFmpeg or download stable prebuilt tools
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == macOS ]]; then
          command -v ffmpeg >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
          command -v ffprobe >/dev/null
          ffmpeg -version
          echo "LIVEPHOTO_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
        else
          bash scripts/prepare-web-ffmpeg.sh
        fi
