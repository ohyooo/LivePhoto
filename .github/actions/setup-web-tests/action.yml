name: Set up Web test runtime
description: Cached browser tooling and stable native fixture generator; no Gradle or JDK.
inputs:
  browser:
    default: chromium
    description: Installed test browser; Safari uses the macOS system browser.
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: |
          ~/.npm
          ~/.cache/ms-playwright
        key: livephoto-web-${{ runner.os }}-${{ hashFiles('scripts/web/package.json') }}

    - name: Install pinned browser tooling
      shell: bash
      working-directory: scripts/web
      run: |
        npm install --ignore-scripts --no-audit --no-fund
        if [[ '${{ inputs.browser }}' != safari ]]; then npx playwright install --with-deps '${{ inputs.browser }}'; fi

    - name: Cache stable FFmpeg fixture generator
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/livephoto-web-ffmpeg/n9.0
        key: web-ffmpeg-n9.0-v1-${{ runner.os }}-${{ runner.arch }}

    - name: Validate cached FFmpeg or download stable prebuilt tools
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == macOS ]]; then
          command -v ffmpeg >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
          command -v ffprobe >/dev/null
          ffmpeg -version
          echo "LIVEPHOTO_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
        else
          bash scripts/prepare-web-ffmpeg.sh
        fi
