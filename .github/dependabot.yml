version: 2
# Includes Android Compose/raw-APK upload/download tooling and desktop Native workflows.
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 0
    registries:
      - maven-google
      - gradle-plugin
    groups:
      maven-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 0
    groups:
      github-actions:
        patterns:
          - "*"

registries:
  maven-google:
    type: maven-repository
    url: https://dl.google.com/dl/android/maven2/
  gradle-plugin:
    type: maven-repository
    url: https://plugins.gradle.org/m2/
