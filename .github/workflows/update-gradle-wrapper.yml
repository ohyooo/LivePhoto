name: Update Gradle Wrapper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-gradle-wrapper
  cancel-in-progress: false

jobs:
  update-gradle-wrapper:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate Wrapper environment
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x ./gradlew ]; then
            echo '::error::gradlew must have its executable bit committed.'
            exit 1
          fi
          command -v rg >/dev/null
          criteriaExit=0
          criteriaFiles=$(rg --files --hidden --no-ignore -g gradle-daemon-jvm.properties) || criteriaExit=$?
          if [ "$criteriaExit" -gt 1 ]; then
            echo '::error::Could not check Gradle daemon JVM criteria.'
            exit "$criteriaExit"
          fi
          if [ -n "$criteriaFiles" ]; then
            echo "$criteriaFiles"
            echo '::error::Remove gradle-daemon-jvm.properties before running Gradle.'
            exit 1
          fi

      - name: Setup JDK
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk
          cache: 'gradle'

      - name: Update Gradle Wrapper
        uses: gradle-update/update-gradle-wrapper-action@main
        with:
          repo-token: ${{ secrets.ACTIONS_TRIGGER_PAT }}

      - name: Merge Gradle Wrapper PR
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_PAT }}
        run: |
          set -euo pipefail

          pr_number=$(gh pr list \
            --state open \
            --limit 100 \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("gradlew-update-"))] | sort_by(.number) | last | .number // empty')

          if [ -z "$pr_number" ]; then
            echo "No Gradle Wrapper PR found."
            exit 0
          fi

          echo "Merging Gradle Wrapper PR #$pr_number"

          gh pr merge "$pr_number" \
            --squash \
            --delete-branch
