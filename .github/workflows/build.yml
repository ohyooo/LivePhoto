name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  native-core:
    name: Core (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Dotted environment names are dropped by some POSIX Wrapper shells.
      # Exercise the same Wrapper option used by the updater on all three hosts.
      GRADLE_OPTS: -Dorg.gradle.project.livephoto.nativeTarget=${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: linuxX64
            runner: ubuntu-24.04
            architecture: x64
            runner-architecture: X64
          - platform: macos-arm64
            target: macosArm64
            runner: macos-15
            architecture: aarch64
            runner-architecture: ARM64
          - platform: windows-x64
            target: mingwX64
            runner: windows-2025
            architecture: x64
            runner-architecture: X64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate environment
        id: environment
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne '${{ matrix.runner-architecture }}') {
            throw 'Unexpected Native host architecture.'
          }
          if (Get-ChildItem -Recurse -File -Filter gradle-daemon-jvm.properties) {
            throw 'Remove gradle-daemon-jvm.properties before running Gradle.'
          }
          # Android's ordinary app/ART adapter is deliberately outside this graph.
          $sources = git ls-files 'core/src/*.kt' 'core/src/*.java' 'cli-shared/src/*.kt' 'cli-native/src/*.kt' 'file-io/src/*.kt' 'process/src/*.kt'
          if ($sources | Where-Object { $_ -match '/src/jvm(Main|Test)/|\.java$' }) {
            throw 'Legacy JVM sources must not return to the Native-only project.'
          }
          foreach ($source in $sources) {
            if (Select-String -LiteralPath $source -Pattern '^\s*import\s+(java|javax)\.' -Quiet) {
              throw 'Native application sources must not import Java runtime APIs.'
            }
          }
          New-Item -ItemType Directory -Path ci-output -Force | Out-Null
          $catalog = Get-Content gradle/libs.versions.toml -Raw
          if ($catalog -notmatch '(?m)^kotlin\s*=\s*"([0-9.]+)"') { throw 'Missing stable Kotlin version.' }
          "kotlin-version=$($Matches[1])" | Add-Content $env:GITHUB_OUTPUT

      - name: Setup JDK 25 for the build tools
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk
          architecture: ${{ matrix.architecture }}
          cache-jdk: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Cache Native compiler and dependencies
        id: konan-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: livephoto-konan-${{ runner.os }}-${{ runner.arch }}-kotlin-${{ steps.environment.outputs.kotlin-version }}
          restore-keys: |
            livephoto-konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare real filesystem fixtures
        shell: pwsh
        run: |
          ./scripts/prepare-file-io-fixtures.ps1
          ./scripts/prepare-file-io-fixtures.ps1

      - name: Prepare real Native process fixture
        shell: pwsh
        run: ./scripts/prepare-process-fixture.ps1

      - name: Prepare fixed protocol fixtures for Native tests
        shell: pwsh
        run: ./scripts/prepare-protocol-fixtures.ps1

      - name: Require real FFmpeg for Native media validation
        shell: pwsh
        run: ./scripts/prepare-native-ffmpeg.ps1

      - name: Compile Native Core and run shared tests
        id: native-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binaryTarget = '${{ matrix.target }}'
          $binaryTarget = $binaryTarget.Substring(0, 1).ToUpperInvariant() + $binaryTarget.Substring(1)
          $gradleArgs = @(
            ':verifyNativeOnlyBuild'
            ':core:${{ matrix.target }}MainKlibrary'
            ':core:${{ matrix.target }}Test'
            '--rerun'
            ':cli-shared:${{ matrix.target }}Test'
            '--rerun'
            ':file-io:${{ matrix.target }}Test'
            '--rerun'
            ':cli-native:${{ matrix.target }}Test'
            '--rerun'
            ':process:${{ matrix.target }}MainKlibrary'
            ':process:${{ matrix.target }}Test'
            '--rerun'
            ":cli-native:linkReleaseExecutable$binaryTarget"
            '--max-workers=1'
            '--console=plain'
            '--warning-mode=all'
            '--stacktrace'
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m'
          )
          $log = Join-Path $env:GITHUB_WORKSPACE 'ci-output/native-core.log'
          if ($IsWindows) {
            & .\gradlew.bat @gradleArgs 2>&1 | Tee-Object -FilePath $log
          } else {
            & ./gradlew @gradleArgs 2>&1 | Tee-Object -FilePath $log
          }
          if ($LASTEXITCODE -ne 0) { throw 'Native compilation or tests failed.' }

      - name: Save validated Native toolchain cache
        if: ${{ steps.native-test.conclusion == 'success' && steps.konan-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}

      - name: Verify Native library and test evidence
        shell: pwsh
        run: ./scripts/verify-native-core-evidence.ps1 -Target '${{ matrix.target }}'

      - name: Verify shared CLI Native test evidence
        shell: pwsh
        run: ./scripts/verify-shared-cli-evidence.ps1 -Target '${{ matrix.target }}'

      - name: Verify Native file IO test evidence
        shell: pwsh
        run: ./scripts/verify-file-io-evidence.ps1 -Target '${{ matrix.target }}'

      - name: Verify Native process test evidence
        shell: pwsh
        run: ./scripts/verify-process-evidence.ps1 -Target '${{ matrix.target }}'

      - name: Package and verify Native CLI and real FFmpeg media
        shell: pwsh
        run: ./scripts/package-native-cli.ps1 -Platform '${{ matrix.platform }}' -Target '${{ matrix.target }}'

      - name: Upload Native CLI
        uses: actions/upload-artifact@v7
        with:
          name: LivePhoto-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-output/native-cli/LivePhoto-*.zip
            ci-output/native-cli/LivePhoto-*.tar.gz
            ci-output/native-cli-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Native Core library
        uses: actions/upload-artifact@v7
        with:
          name: LivePhoto-native-core-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-output/native-core/core.klib
            ci-output/native-core/file-io.klib
            ci-output/native-core/process.klib
            ci-output/native-core/process-posix.klib
            ci-output/native-core/process-win32.klib
            ci-output/native-core-evidence.json
            ci-output/shared-cli-evidence.json
            ci-output/file-io-evidence.json
            ci-output/process-evidence.json
            ci-output/native-ffmpeg-version.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Native test reports and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-core-reports-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            core/build/test-results/${{ matrix.target }}Test/
            core/build/reports/tests/${{ matrix.target }}Test/
            core/build/reports/protocol-compatibility/verified-captures.tsv
            core/build/reports/protocol-compatibility/asset-manifest.json
            core/build/portable-heic-fixtures/manifest.txt
            core/build/reports/huawei-heic-fixtures/manifest.txt
            core/build/portable-apple-heif-fixtures/manifest.txt
            core/build/portable-apple-ordinary-exif-fixtures/manifest.txt
            core/build/reports/samsung-remux-fixtures/manifest.txt
            core/build/reports/vivo-remux-fixtures/manifest.txt
            core/build/reports/huawei-remux-fixtures/manifest.txt
            cli-shared/build/test-results/${{ matrix.target }}Test/
            cli-shared/build/reports/tests/${{ matrix.target }}Test/
            file-io/build/test-results/${{ matrix.target }}Test/
            file-io/build/reports/tests/${{ matrix.target }}Test/
            cli-native/build/test-results/${{ matrix.target }}Test/
            cli-native/build/reports/tests/${{ matrix.target }}Test/
            process/build/test-results/${{ matrix.target }}Test/
            process/build/reports/tests/${{ matrix.target }}Test/
            ci-output/native-core.log
            ci-output/native-core-evidence.json
            ci-output/shared-cli-evidence.json
            ci-output/file-io-evidence.json
            ci-output/native-cli-evidence.json
            ci-output/native-cli-smoke.log
            ci-output/process-evidence.json
          if-no-files-found: warn
          retention-days: 14
