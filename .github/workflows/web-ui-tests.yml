name: Web UI viewport tests

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      viewport:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Chromium UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: ci-output

      - name: Verify exact compiled inputs and prepare API path
        run: node scripts/web/verify-build.mjs

      - uses: ./.github/actions/setup-web-tests

      - name: Run full UI coverage for this viewport
        shell: bash
        env:
          LIVEPHOTO_UI_VIEWPORT: ${{ inputs.viewport }}
        run: |
          set -euo pipefail
          node scripts/web/verify-ui.mjs 2>&1 | tee "ci-output/web-ui-browser-${LIVEPHOTO_UI_VIEWPORT}.log"

      - name: Preserve independent viewport evidence without media
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-report-ui-${{ inputs.viewport }}-${{ github.run_id }}
          overwrite: true
          path: |
            ci-output/web-ui-browser-${{ inputs.viewport }}.log
            ci-output/web-ui-browser-evidence-${{ inputs.viewport }}.json
            ci-output/web-ui-*.png
            ci-output/web-ui-failure*.html
            ci-output/web-ui-failure*-a11y.txt
          if-no-files-found: warn
          retention-days: 1
