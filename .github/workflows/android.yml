name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.project.livephoto.android=true
      LIVEPHOTO_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate Android environment
        id: environment
        shell: pwsh
        run: |
          if (Get-ChildItem -Recurse -File -Filter gradle-daemon-jvm.properties) {
            throw 'Remove gradle-daemon-jvm.properties before running Gradle.'
          }
          if (-not $env:ANDROID_HOME -or -not (Test-Path -LiteralPath $env:ANDROID_HOME)) { throw 'Existing Android SDK required.' }
          Get-ChildItem ui/src/commonMain -Recurse -File -Filter '*.kt' | ForEach-Object {
            if (Select-String -LiteralPath $_.FullName -Pattern '^\s*import\s+(android|java|javax)\.' -Quiet) {
              throw 'Shared Compose UI must not import platform APIs.'
            }
          }
          "sdk=$env:ANDROID_HOME" | Add-Content $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Path ci-output -Force | Out-Null

      - name: Setup JDK 25 for build tools
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk
          cache-jdk: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Cache stable Android emulator image
        uses: actions/cache@v6
        with:
          path: ${{ steps.environment.outputs.sdk }}/system-images/android-36
          key: livephoto-android-system-image-${{ runner.os }}-36-google-apis-x86-64

      - name: Install required Android SDK components
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Prepare fixed test-only media
        shell: pwsh
        run: ./scripts/prepare-android-fixtures.ps1

      - name: Restore shared private signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.LIVEPHOTO_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.LIVEPHOTO_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.LIVEPHOTO_SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.LIVEPHOTO_SIGNING_KEY_ALIAS }}
        run: |
          if (-not $env:SIGNING_KEYSTORE_BASE64) {
            throw 'Main APK builds require the persistent shared signing key.'
          }
          if (-not $env:SIGNING_STORE_PASSWORD -or -not $env:SIGNING_KEY_PASSWORD -or -not $env:SIGNING_KEY_ALIAS) {
            throw 'Custom signing configuration is incomplete.'
          }
          $path = Join-Path $env:RUNNER_TEMP 'livephoto-signing.jks'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_KEYSTORE_BASE64))
          "LIVEPHOTO_SIGNING_KEYSTORE=$path" | Add-Content $env:GITHUB_ENV
          "LIVEPHOTO_SIGNING_STORE_PASSWORD=$env:SIGNING_STORE_PASSWORD" | Add-Content $env:GITHUB_ENV
          "LIVEPHOTO_SIGNING_KEY_PASSWORD=$env:SIGNING_KEY_PASSWORD" | Add-Content $env:GITHUB_ENV
          "LIVEPHOTO_SIGNING_KEY_ALIAS=$env:SIGNING_KEY_ALIAS" | Add-Content $env:GITHUB_ENV
          'LIVEPHOTO_EXPECTED_SIGNER=4a010b28ce4c266c3720fe3628d145b777c9960ade5d0b0f2e9f70f4efbfbcd8' | Add-Content $env:GITHUB_ENV

      - name: Build debug and release APKs, test APK, unit tests and lint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./gradlew :verifyAndroidBuild :android:assembleDebug :android:assembleRelease :android:assembleDebugAndroidTest :android:testDebugUnitTest --rerun :android:testReleaseUnitTest --rerun :android:lintDebug :android:lintRelease --max-workers=2 --console=plain --warning-mode=all --stacktrace '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' 2>&1 | Tee-Object -FilePath ci-output/android-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Android compilation, unit tests or lint failed.' }

      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Run real Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash -o pipefail -c './gradlew :android:connectedDebugAndroidTest --rerun --max-workers=2 --console=plain --warning-mode=all --stacktrace "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m" 2>&1 | tee ci-output/android-device.log'
            pwsh -File ./scripts/smoke-android-packages.ps1

      - name: Verify fresh tests and installable APK evidence
        shell: pwsh
        run: ./scripts/verify-android-evidence.ps1

      - name: Upload debug APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/apks/LivePhoto-debug.apk
          archive: false
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/apks/LivePhoto-release.apk
          archive: false
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android reports without media-bearing test APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/build/test-results/
            android/build/outputs/androidTest-results/
            android/build/reports/
            android/build/outputs/mapping/release/
            ci-output/android-*.log
            ci-output/android-evidence.json
            ci-output/android-*-signature.txt
            ci-output/android-install-evidence.json
            ci-output/android-*-screen.png
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish direct APK downloads
    needs: android
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified debug APK without unpacking it
        uses: actions/download-artifact@v8
        with:
          name: LivePhoto-debug.apk
          path: apks
          skip-decompress: true
          digest-mismatch: error
      - name: Download verified release APK without unpacking it
        uses: actions/download-artifact@v8
        with:
          name: LivePhoto-release.apk
          path: apks
          skip-decompress: true
          digest-mismatch: error
      - name: Publish immutable Android build
        run: |
          test -f apks/LivePhoto-debug.apk
          test -f apks/LivePhoto-release.apk
          gh release create 'android-${{ github.run_id }}-${{ github.run_attempt }}' \
            apks/LivePhoto-debug.apk apks/LivePhoto-release.apk \
            --target '${{ github.sha }}' --prerelease --latest=false \
            --title 'Android build ${{ github.run_number }}' \
            --notes 'Debug/release APKs share the persistent signing key. Commit: ${{ github.sha }}. Experimental Android application; device gallery compatibility requires manual testing.'
