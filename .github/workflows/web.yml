name: Web Library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Web library and shared UI once
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
    env:
      GRADLE_OPTS: -Dorg.gradle.project.livephoto.web=true -Dorg.gradle.project.livephoto.webUi=true
    steps:
      - uses: actions/checkout@v7

      - name: Validate build environment
        shell: pwsh
        run: |
          if (Get-ChildItem -Recurse -File -Filter gradle-daemon-jvm.properties) {
            throw 'Remove gradle-daemon-jvm.properties before running Gradle.'
          }
          Get-Command node -ErrorAction Stop | Out-Null
          Get-ChildItem -Path 'scripts/web/*.mjs', 'scripts/web/media/*.mjs' -File | ForEach-Object {
            & node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Browser script syntax check failed: $($_.Name)" }
          }
          New-Item -ItemType Directory -Path ci-output -Force | Out-Null

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk
          cache-jdk: true

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      # Save newer compiled work independently of the immutable dependency cache,
      # including when a downstream browser test fails.
      - name: Restore Gradle task outputs
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: web-gradle-tasks-v1-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            web-gradle-tasks-v1-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Cache Kotlin Wasm optimizer
        uses: actions/cache@v6
        with:
          path: ~/.gradle/binaryen
          key: web-binaryen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Build production library and Compose website
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :verifyWebBuild :shared:jsBrowserProductionLibraryDistribution :ui:wasmJsBrowserDistribution --max-workers=2 --console=plain --warning-mode=all --stacktrace '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' 2>&1 | tee ci-output/web-build.log ci-output/web-ui-build.log

      - name: Cache packaging dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: web-npm-${{ runner.os }}-${{ hashFiles('scripts/web/package.json') }}

      - name: Install pinned packaging dependencies
        working-directory: scripts/web
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Package library
        shell: pwsh
        run: ./scripts/package-web.ps1

      - name: Package shared website
        shell: pwsh
        run: ./scripts/package-web-ui.ps1

      - name: Verify packaged build identity and hashes
        run: node scripts/web/verify-build.mjs

      - id: names
        name: Identify this build for downstream jobs and failed-job reruns
        run: echo "artifact=web-test-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Share compiled outputs without test media
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: |
            ci-output/web-library/
            ci-output/web-ui/
            ci-output/web-package-evidence.json
            ci-output/web-ui-package-evidence.json
            ci-output/web-build.log
            ci-output/web-ui-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve failed build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-output/*.log
          if-no-files-found: warn
          retention-days: 14

  common:
    name: Test Kotlin common protocol
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.project.livephoto.web=true
    steps:
      - uses: actions/checkout@v7

      - name: Validate existing test tools
        shell: pwsh
        run: |
          if (Get-ChildItem -Recurse -File -Filter gradle-daemon-jvm.properties) {
            throw 'Remove gradle-daemon-jvm.properties before running Gradle.'
          }
          Get-Command node -ErrorAction Stop | Out-Null
          $chrome = (Get-Command google-chrome -ErrorAction Stop).Source
          "CHROME_BIN=$chrome" >> $env:GITHUB_ENV
          & $chrome --version
          New-Item -ItemType Directory -Path ci-output -Force | Out-Null

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk
          cache-jdk: true

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Restore compiled Kotlin task outputs
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: web-gradle-tasks-v1-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            web-gradle-tasks-v1-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Execute unchanged common Kotlin protocol tests in Chrome
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :verifyWebBuild :shared:jsBrowserTest --max-workers=2 --console=plain --warning-mode=all --stacktrace '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' 2>&1 | tee ci-output/web-common.log

      - name: Verify all declared cases executed without skipping
        shell: pwsh
        run: ./scripts/verify-web-common-evidence.ps1

      - name: Execute the same common Kotlin tests as Wasm in Chrome
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :verifyWebBuild :shared:wasmJsBrowserTest --max-workers=2 --console=plain --warning-mode=all --stacktrace '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' 2>&1 | tee ci-output/web-wasm-common.log

      - name: Verify every Wasm test executed without skipping
        shell: pwsh
        run: ./scripts/verify-web-common-evidence.ps1 -Target wasmJs

      - name: Collect raw common test diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ci-output/web-common-results -Force | Out-Null
          Get-ChildItem shared/build/test-results/jsBrowserTest -File -Filter '*.xml' -ErrorAction SilentlyContinue |
            Copy-Item -Destination ci-output/web-common-results -Force
          New-Item -ItemType Directory -Path ci-output/web-wasm-common-results -Force | Out-Null
          Get-ChildItem shared/build/test-results/wasmJsBrowserTest -File -Filter '*.xml' -ErrorAction SilentlyContinue |
            Copy-Item -Destination ci-output/web-wasm-common-results -Force

      - name: Preserve Kotlin common test evidence without media
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-report-common-${{ github.run_id }}
          overwrite: true
          path: |
            ci-output/web-common.log
            ci-output/web-common-evidence.json
            ci-output/web-common-results/*.xml
            ci-output/web-wasm-common.log
            ci-output/web-wasm-common-evidence.json
            ci-output/web-wasm-common-results/*.xml
          if-no-files-found: warn
          retention-days: 1

  test:
    name: Test Web ${{ matrix.kind }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: protocol
            script: verify-browser
            log: web-browser.log
            evidence: web-browser-evidence.json
          - kind: media
            script: verify-media
            log: web-media.log
            evidence: web-media-evidence.json
          - kind: player
            script: verify-player
            log: web-player.log
            evidence: web-player-evidence.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ci-output

      - name: Verify exact compiled inputs and prepare API path
        run: node scripts/web/verify-build.mjs

      - uses: ./.github/actions/setup-web-tests

      - name: Test browser-following theme and real toggle rendering
        if: ${{ matrix.kind == 'player' }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/web/verify-theme.mjs 2>&1 | tee ci-output/web-theme.log

      - name: Run ${{ matrix.kind }} in real Chromium
        shell: bash
        run: |
          set -o pipefail
          node scripts/web/${{ matrix.script }}.mjs 2>&1 | tee ci-output/${{ matrix.log }}

      - name: Preserve independent test evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Failed-job reruns replace only their own report, retaining siblings.
          name: web-test-report-${{ matrix.kind }}-${{ github.run_id }}
          overwrite: true
          path: |
            ci-output/${{ matrix.log }}
            ci-output/${{ matrix.evidence }}
            ci-output/web-theme.log
            ci-output/web-theme-evidence.json
            ci-output/web-ui-*.png
            ci-output/web-ui-failure*.html
            ci-output/web-ui-failure-a11y.txt
            ci-output/web-ui-player-failure-a11y.txt
          if-no-files-found: warn
          retention-days: 1

  ui:
    name: Test Web UI (${{ matrix.viewport }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        viewport: [mobile, wide]
    uses: ./.github/workflows/web-ui-tests.yml
    with:
      artifact: ${{ needs.build.outputs.artifact }}
      viewport: ${{ matrix.viewport }}

  publish:
    name: Collect reports and publish tested outputs
    if: ${{ always() && needs.build.result == 'success' && !cancelled() }}
    needs: [build, test, common, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ci-output

      - uses: actions/download-artifact@v8
        with:
          pattern: web-test-report-*-${{ github.run_id }}
          merge-multiple: true
          path: ci-output

      - name: Merge and verify both complete UI viewport reports
        if: ${{ needs.test.result == 'success' && needs.common.result == 'success' && needs.ui.result == 'success' }}
        run: node scripts/web/merge-ui-evidence.mjs

      - name: Verify source identity and complete independent evidence
        if: ${{ needs.test.result == 'success' && needs.common.result == 'success' && needs.ui.result == 'success' }}
        run: node scripts/web/verify-build.mjs --tests

      - name: Publish verified browser library
        if: ${{ success() && needs.test.result == 'success' && needs.common.result == 'success' && needs.ui.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: LivePhoto-web-js-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-output/web-library/
            ci-output/web-package-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified shared website
        if: ${{ success() && needs.test.result == 'success' && needs.common.result == 'success' && needs.ui.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: LivePhoto-web-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-output/web-ui/
            ci-output/web-ui-package-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish protocol reports without test media
        id: protocol_reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-output/web-build.log
            ci-output/web-browser.log
            ci-output/web-package-evidence.json
            ci-output/web-browser-evidence.json
            ci-output/web-common.log
            ci-output/web-common-evidence.json
            ci-output/web-common-results/*.xml
            ci-output/web-wasm-common.log
            ci-output/web-wasm-common-evidence.json
            ci-output/web-wasm-common-results/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish UI and media reports without test media
        id: ui_reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-ui-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-output/web-ui-build.log
            ci-output/web-ui-browser.log
            ci-output/web-ui-package-evidence.json
            ci-output/web-ui-browser-evidence.json
            ci-output/web-ui-browser-mobile.log
            ci-output/web-ui-browser-wide.log
            ci-output/web-ui-browser-evidence-mobile.json
            ci-output/web-ui-browser-evidence-wide.json
            ci-output/web-media.log
            ci-output/web-media-evidence.json
            ci-output/web-player.log
            ci-output/web-player-evidence.json
            ci-output/web-theme.log
            ci-output/web-theme-evidence.json
            ci-output/web-ui-player-failure-a11y.txt
            ci-output/web-ui-*.png
            ci-output/web-ui-failure*.html
            ci-output/web-ui-failure*-a11y.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary handoff artifacts after successful collection
        if: ${{ success() && needs.test.result == 'success' && needs.common.result == 'success' && needs.ui.result == 'success' && github.event_name != 'pull_request' && steps.protocol_reports.outcome == 'success' && steps.ui_reports.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name | startswith("web-test-")) | .id' |
          while read -r artifact_id; do
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done

      - name: Keep failed test suites visible in the aggregate result
        if: ${{ always() && (needs.test.result != 'success' || needs.common.result != 'success' || needs.ui.result != 'success') }}
        run: exit 1
