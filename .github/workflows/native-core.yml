name: Native Core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  native-core:
    name: Core (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: linuxX64
            runner: ubuntu-24.04
            architecture: x64
            runner-architecture: X64
          - platform: macos-arm64
            target: macosArm64
            runner: macos-15
            architecture: aarch64
            runner-architecture: ARM64
          - platform: windows-x64
            target: mingwX64
            runner: windows-2025
            architecture: x64
            runner-architecture: X64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate environment
        id: environment
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne '${{ matrix.runner-architecture }}') {
            throw 'Unexpected Native host architecture.'
          }
          if (Get-ChildItem -Recurse -File -Filter gradle-daemon-jvm.properties) {
            throw 'Remove gradle-daemon-jvm.properties before running Gradle.'
          }
          New-Item -ItemType Directory -Path ci-output -Force | Out-Null
          $catalog = Get-Content gradle/libs.versions.toml -Raw
          if ($catalog -notmatch '(?m)^kotlin\s*=\s*"([0-9.]+)"') { throw 'Missing stable Kotlin version.' }
          "kotlin-version=$($Matches[1])" | Add-Content $env:GITHUB_OUTPUT

      - name: Setup JDK 25 for the build tools
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk
          architecture: ${{ matrix.architecture }}
          cache-jdk: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Cache Native compiler and dependencies
        id: konan-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: livephoto-konan-${{ runner.os }}-${{ runner.arch }}-kotlin-${{ steps.environment.outputs.kotlin-version }}
          restore-keys: |
            livephoto-konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare real filesystem fixtures
        shell: pwsh
        run: ./scripts/prepare-file-io-fixtures.ps1

      - name: Compile Native Core and run shared tests
        id: native-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradleArgs = @(
            '-Plivephoto.nativeTarget=${{ matrix.platform }}'
            ':core:${{ matrix.target }}MainKlibrary'
            ':core:${{ matrix.target }}Test'
            '--rerun'
            ':cli-shared:${{ matrix.target }}Test'
            '--rerun'
            ':file-io:${{ matrix.target }}Test'
            '--rerun'
            '--max-workers=1'
            '--console=plain'
            '--warning-mode=all'
            '--stacktrace'
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m'
          )
          $log = Join-Path $env:GITHUB_WORKSPACE 'ci-output/native-core.log'
          if ($IsWindows) {
            & .\gradlew.bat @gradleArgs 2>&1 | Tee-Object -FilePath $log
          } else {
            & ./gradlew @gradleArgs 2>&1 | Tee-Object -FilePath $log
          }
          if ($LASTEXITCODE -ne 0) { throw 'Native compilation or tests failed.' }

      - name: Save validated Native toolchain cache
        if: ${{ steps.native-test.conclusion == 'success' && steps.konan-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}

      - name: Verify Native library and test evidence
        shell: pwsh
        run: ./scripts/verify-native-core-evidence.ps1 -Target '${{ matrix.target }}'

      - name: Verify shared CLI Native test evidence
        shell: pwsh
        run: ./scripts/verify-shared-cli-evidence.ps1 -Target '${{ matrix.target }}'

      - name: Verify Native file IO test evidence
        shell: pwsh
        run: ./scripts/verify-file-io-evidence.ps1 -Target '${{ matrix.target }}'

      - name: Upload Native Core library
        uses: actions/upload-artifact@v7
        with:
          name: LivePhoto-native-core-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-output/native-core/core.klib
            ci-output/native-core-evidence.json
            ci-output/shared-cli-evidence.json
            ci-output/file-io-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Native test reports and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-core-reports-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            core/build/test-results/${{ matrix.target }}Test/
            core/build/reports/tests/${{ matrix.target }}Test/
            cli-shared/build/test-results/${{ matrix.target }}Test/
            cli-shared/build/reports/tests/${{ matrix.target }}Test/
            file-io/build/test-results/${{ matrix.target }}Test/
            file-io/build/reports/tests/${{ matrix.target }}Test/
            core/build/libs/
            core/build/classes/kotlin/${{ matrix.target }}/main/
            ci-output/native-core.log
            ci-output/native-core-evidence.json
            ci-output/shared-cli-evidence.json
            ci-output/file-io-evidence.json
          if-no-files-found: warn
          retention-days: 14
