name: Sync tested website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-sync.yml
      - scripts/sync-pages.py
      - scripts/test_sync_pages.py
  pull_request:
    paths:
      - .github/workflows/pages-sync.yml
      - scripts/sync-pages.py
      - scripts/test_sync_pages.py
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful main-branch Web Library run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sync-tested-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check artifact identity and unsafe archive refusal
        run: python3 -m unittest discover -s scripts -p test_sync_pages.py

      - name: Verify, synchronize and await public-site browser checks
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          PAGES_HTTPS_TOKEN: ${{ secrets.PAGES_HTTPS_TOKEN }}
        run: python3 scripts/sync-pages.py
