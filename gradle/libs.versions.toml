[versions]
kotlin = "2.4.21"
okio = "3.18.2"
coroutines = "1.11.0"
browser = "0.5.0"
agp = "9.4.1"
android-test-runner = "1.7.0"
android-test-junit = "1.3.0"
android-activity = "1.13.0"
compose-bom = "2026.09.00"
compose-multiplatform = "1.12.2"
compose-material3 = "1.9.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "browser" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
android-test-runner = { module = "androidx.test:runner", version.ref = "android-test-runner" }
android-test-junit = { module = "androidx.test.ext:junit", version.ref = "android-test-junit" }
android-activity = { module = "androidx.activity:activity", version.ref = "android-activity" }
android-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "android-activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-shared-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-shared-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-shared-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-shared-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
